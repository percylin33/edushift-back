# =============================================================================
# EduShift - configuración común
# Perfiles: application-dev.properties | application-prod.properties
# =============================================================================

spring.application.name=edushift-back
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# -----------------------------------------------------------------------------
# Servidor
# -----------------------------------------------------------------------------
server.port=${SERVER_PORT:${PORT:8080}}
# Render / PaaS health checks require binding all interfaces (not only localhost).
server.address=${SERVER_ADDRESS:0.0.0.0}
server.servlet.context-path=${SERVER_CONTEXT_PATH:/api}

# -----------------------------------------------------------------------------
# PostgreSQL (valores por perfil; variables de entorno documentadas abajo)
# -----------------------------------------------------------------------------
# DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD
# DB_SCHEMA (opcional, default public)
# DB_SSL_MODE (opcional: disable | prefer | require | verify-full)
# DB_APPLICATION_NAME (opcional, identificador en pg_stat_activity)
#
# Plataformas PaaS (Render, Railway, Heroku, fly.io) inyectan la conexión
# como SPRING_DATASOURCE_URL/_USERNAME/_PASSWORD. application-prod.properties
# ya prioriza SPRING_DATASOURCE_URL sobre la construcción manual desde DB_*.
# Si tu proveedor no las inyecta con ese nombre, seteá DB_HOST/DB_USER/...
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.type=com.zaxxer.hikari.HikariDataSource

# HikariCP - valores base (perfiles dev/prod ajustan el pool)
spring.datasource.hikari.pool-name=${HIKARI_POOL_NAME:EduShiftHikariPool}
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.validation-timeout=${HIKARI_VALIDATION_TIMEOUT:5000}
spring.datasource.hikari.register-mbeans=true

# PDF OCR fallback for sparse/scanned pages. The worker stays asynchronous;
# native development environments must have Tesseract installed and on PATH.
app.ai.source-ocr.enabled=${AI_SOURCE_OCR_ENABLED:true}
app.ai.source-ocr.command=${AI_SOURCE_OCR_COMMAND:tesseract}
app.ai.source-ocr.languages=${AI_SOURCE_OCR_LANGUAGES:spa+eng}
app.ai.source-ocr.dpi=${AI_SOURCE_OCR_DPI:250}
app.ai.source-ocr.max-pages=${AI_SOURCE_OCR_MAX_PAGES:100}
app.ai.source-ocr.timeout-seconds=${AI_SOURCE_OCR_TIMEOUT_SECONDS:20}
app.ai.source-ocr.max-duration-seconds=${AI_SOURCE_OCR_MAX_DURATION_SECONDS:180}

# -----------------------------------------------------------------------------
# JPA / Hibernate
# -----------------------------------------------------------------------------
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true
spring.jpa.properties.hibernate.generate_statistics=false

# -----------------------------------------------------------------------------
# Flyway (migraciones automáticas al arranque, antes que Hibernate validate)
# -----------------------------------------------------------------------------
# FLYWAY_ENABLED, FLYWAY_SCHEMAS, FLYWAY_DEFAULT_SCHEMA, FLYWAY_CLEAN_DISABLED
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=${FLYWAY_SCHEMAS:edushift}
spring.flyway.default-schema=${FLYWAY_DEFAULT_SCHEMA:edushift}
spring.flyway.create-schemas=true
spring.flyway.table=flyway_schema_history
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.baseline-description=<< EduShift baseline >>
spring.flyway.validate-on-migrate=true
spring.flyway.validate-migration-naming=true
spring.flyway.out-of-order=false
spring.flyway.clean-disabled=true
spring.flyway.clean-on-validation-error=false
spring.flyway.mixed=false
spring.flyway.fail-on-missing-locations=true
spring.flyway.placeholder-replacement=true
spring.flyway.postgresql.transactional-lock=true

# JPA usa el mismo esquema que Flyway
spring.jpa.properties.hibernate.default_schema=${FLYWAY_DEFAULT_SCHEMA:edushift}

# -----------------------------------------------------------------------------
# Redis / Cache
# -----------------------------------------------------------------------------
spring.cache.type=redis
spring.data.redis.repositories.enabled=false

# REDIS_HOST, REDIS_PORT, REDIS_PASSWORD, REDIS_SSL_ENABLED (perfil prod)
#
# Plataformas PaaS (Render/Railway/Heroku/fly.io) inyectan REDIS_URL como
# redis://:pass@host:port (o rediss:// con TLS). Spring Boot 3 lo soporta
# nativamente con spring.data.redis.url. application-prod.properties lo
# prioriza sobre REDIS_HOST/PORT cuando está seteado.
# spring.data.redis.url=${SPRING_DATA_REDIS_URL:}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:2s}
spring.data.redis.lettuce.pool.enabled=true
spring.data.redis.lettuce.pool.max-active=${REDIS_POOL_MAX_ACTIVE:16}
spring.data.redis.lettuce.pool.max-idle=${REDIS_POOL_MAX_IDLE:8}
spring.data.redis.lettuce.pool.min-idle=${REDIS_POOL_MIN_IDLE:2}
spring.data.redis.lettuce.pool.max-wait=${REDIS_POOL_MAX_WAIT:2s}

# EduShift Redis (TTL por dominio; ISO-8601 o unidades: 5m, 1h, 30s)
edushift.redis.enabled=${REDIS_ENABLED:true}
edushift.redis.key-prefix=${REDIS_KEY_PREFIX:edushift:}
edushift.redis.default-ttl=${REDIS_DEFAULT_TTL:10m}
edushift.redis.cache.dashboards.ttl=${CACHE_TTL_DASHBOARDS:5m}
edushift.redis.cache.permissions.ttl=${CACHE_TTL_PERMISSIONS:15m}
edushift.redis.cache.tenant-config.ttl=${CACHE_TTL_TENANT_CONFIG:1h}
edushift.redis.cache.ai-context.ttl=${CACHE_TTL_AI_CONTEXT:30m}

# -----------------------------------------------------------------------------
# Aplicación (frontend / CORS / base URL)
# -----------------------------------------------------------------------------
app.base-url=${APP_BASE_URL:}
app.frontend.url=${FRONTEND_URL:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
app.cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:true}
app.cors.max-age=${CORS_MAX_AGE:3600}

# -----------------------------------------------------------------------------
# Seguridad / JWT
# -----------------------------------------------------------------------------
# JWT_SECRET es obligatorio (mín 32 caracteres para HS256). NO usar defaults en prod.
app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.issuer=${JWT_ISSUER:edushift}
app.security.jwt.audience=${JWT_AUDIENCE:edushift-clients}
app.security.jwt.access-token-ttl=${JWT_ACCESS_TTL:15m}
app.security.jwt.refresh-token-ttl=${JWT_REFRESH_TTL:7d}
app.security.jwt.header=${JWT_HEADER:Authorization}
app.security.jwt.token-prefix=${JWT_TOKEN_PREFIX:Bearer }

# -----------------------------------------------------------------------------
# Attendance (Sprint 6)
# -----------------------------------------------------------------------------
# late-after-default-minutes : default global del calculo de tarde (sobrescrito por tenant.settings.attendance.lateAfterMinutes).
# settings-cache-ttl-seconds : TTL del cache local de tenant settings (ADR-6.5).
# future-drift-tolerance-minutes : maximo drift permitido del occurredAt enviado por el cliente respecto a now().
# edit-window-hours          : ventana en la que TEACHER puede editar un record (ADR-6.7); admins sin ventana.
edushift.attendance.late-after-default-minutes=${ATTENDANCE_LATE_AFTER_DEFAULT_MIN:10}
edushift.attendance.settings-cache-ttl-seconds=${ATTENDANCE_SETTINGS_CACHE_TTL_SECONDS:60}
edushift.attendance.future-drift-tolerance-minutes=${ATTENDANCE_FUTURE_DRIFT_TOLERANCE_MIN:1}
edushift.attendance.edit-window-hours=${ATTENDANCE_EDIT_WINDOW_HOURS:24}
# End-of-day: soft-delete ACTIVE sessions with 0 check-ins (no ABSENT). Morning-open stays off.
edushift.attendance.abandon-unused.enabled=${EDUSHIFT_ATTENDANCE_ABANDON_UNUSED_ENABLED:true}
edushift.attendance.abandon-unused.cron=${EDUSHIFT_ATTENDANCE_ABANDON_UNUSED_CRON:0 30 20 * * MON-FRI}
edushift.attendance.abandon-unused.zone=${EDUSHIFT_ATTENDANCE_ABANDON_UNUSED_ZONE:America/Lima}

# QR rendering (BE-6.3): pixel-size aplica a ambos formatos (PNG buffer y SVG width/height);
# error-correction admite L | M | Q | H (ZXing); margin-modules es la zona "quiet" en modulos QR
# (multiplicado por el tamano por modulo en pixeles que calcula ZXing).
edushift.attendance.qr.pixel-size=${ATTENDANCE_QR_PIXEL_SIZE:320}
edushift.attendance.qr.error-correction=${ATTENDANCE_QR_ERROR_CORRECTION:L}
edushift.attendance.qr.margin-modules=${ATTENDANCE_QR_MARGIN_MODULES:4}

# -----------------------------------------------------------------------------
# Integraciones - MiniMax (módulo AI, provider activo)
# MiniMax es el único LLM provider soportado. Si está apagado, MockLlmClient
# toma el relevo (dev/test sin API key). Ver docs/architecture/ai.md §MiniMax
# operational para costos, rate limits y secret management.
#
# Base URL oficial (OpenAI-compatible chat completions, según docs oficiales
# https://platform.minimax.io/docs/guides/quickstart-preparation.md):
#   https://api.minimax.io/v1
# Anthropic-compatible (no usado por este BE, soportado por su SDK):
#   https://api.minimax.io/anthropic
# AI habilitado por default en TODOS los profiles. Configurar MINIMAX_API_KEY
# via env var. Si no se setea y enabled=true → fallback automático a MockLlmClient
# (ver LlmAutoConfiguration: detecta api-key vacía y degrada).
# -----------------------------------------------------------------------------
app.llm.minimax.enabled=${MINIMAX_ENABLED:true}
app.llm.minimax.api-key=${MINIMAX_API_KEY:}
app.llm.minimax.base-url=${MINIMAX_BASE_URL:https://api.minimax.io/v1}
app.llm.minimax.default-model=${MINIMAX_DEFAULT_MODEL:MiniMax-M3}
app.llm.minimax.timeout=${MINIMAX_TIMEOUT:30s}
app.llm.minimax.max-retries=${MINIMAX_MAX_RETRIES:2}

# Ollama local (OpenAI-compatible, sin API key). Apagado fuera de dev.
# Si enabled=true, MiniMaxLlmClient no se registra.
app.llm.ollama.enabled=${OLLAMA_ENABLED:false}
app.llm.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434/v1}
app.llm.ollama.default-model=${OLLAMA_DEFAULT_MODEL:gemma4:e2b}
app.llm.ollama.timeout=${OLLAMA_TIMEOUT:120s}
app.llm.ollama.max-retries=${OLLAMA_MAX_RETRIES:1}

# -----------------------------------------------------------------------------
# Integraciones - Firebase (notificaciones FCM, opcionalmente auth)
# Usar FIREBASE_CREDENTIALS_JSON (raw) o FIREBASE_CREDENTIALS_PATH (archivo montado).
# -----------------------------------------------------------------------------
# Google OAuth / Gmail. El cliente se deja inactivo si no se configura.
app.integrations.google.enabled=${GOOGLE_OAUTH_ENABLED:false}
app.integrations.google.client-id=${GOOGLE_OAUTH_CLIENT_ID:disabled}
app.integrations.google.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:}
app.integrations.gmail.scopes=${GOOGLE_GMAIL_SCOPES:openid,email,profile}
app.integrations.gmail.encryption-key-base64=${GOOGLE_TOKEN_ENCRYPTION_KEY:}
app.integrations.gmail.daily-send-cap-per-user=${GOOGLE_GMAIL_DAILY_SEND_CAP_PER_USER:100}
app.integrations.firebase.enabled=${FIREBASE_ENABLED:false}
app.integrations.firebase.project-id=${FIREBASE_PROJECT_ID:}
app.integrations.firebase.credentials-json=${FIREBASE_CREDENTIALS_JSON:}
app.integrations.firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:}
app.integrations.firebase.web-api-key=${FIREBASE_WEB_API_KEY:}
app.integrations.firebase.database-url=${FIREBASE_DATABASE_URL:}
app.integrations.firebase.storage-bucket=${FIREBASE_STORAGE_BUCKET:}

# -----------------------------------------------------------------------------
# Storage (Sprint 7a / BE-7a.0)
# app.storage.provider          : LOCAL_FS (dev/test) | FIREBASE (prod/staging)
# app.storage.env               : object-key segment envs/{env}/... (dev|staging|prod); empty → profile-derived
# app.storage.max-file-size-bytes : per-file cap; mirrored to Spring multipart below
# app.storage.local-fs.root     : filesystem root for the LOCAL_FS provider
# app.storage.local-fs.serve-from-controller
#                                : true  -> downloads stream through GET /v1/files/{uuid}/download
#                                : false -> Firebase provider redirects 302 to a signed URL
# app.storage.firebase.*        : bucket + credentials + signed-URL TTL
# Object key layout: envs/{env}/tenants/{tenantId}/{module}/{yyyy}/{MM}/{uuid}.ext
# -----------------------------------------------------------------------------
app.storage.provider=${STORAGE_PROVIDER:LOCAL_FS}
app.storage.env=${STORAGE_ENV:}
app.storage.max-file-size-bytes=${STORAGE_MAX_FILE_SIZE_BYTES:26214400}
app.storage.allowed-content-types=${STORAGE_ALLOWED_CONTENT_TYPES:application/pdf,image/png,image/jpeg,image/webp,image/gif,image/svg+xml,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-powerpoint,application/vnd.openxmlformats-officedocument.presentationml.presentation,text/plain,text/csv,application/zip}
app.storage.local-fs.root=${STORAGE_LOCAL_FS_ROOT:./edushift-storage}
app.storage.local-fs.serve-from-controller=${STORAGE_LOCAL_FS_SERVE_FROM_CONTROLLER:true}
app.storage.firebase.bucket=${STORAGE_FIREBASE_BUCKET:${FIREBASE_STORAGE_BUCKET:}}
app.storage.firebase.credentials-json=${STORAGE_FIREBASE_CREDENTIALS_JSON:${FIREBASE_CREDENTIALS_JSON:}}
app.storage.firebase.credentials-path=${STORAGE_FIREBASE_CREDENTIALS_PATH:${FIREBASE_CREDENTIALS_PATH:}}
app.storage.firebase.signed-url-ttl-seconds=${STORAGE_FIREBASE_SIGNED_URL_TTL:900}

# Spring multipart mirrors (max 25MB by default, see app.storage.max-file-size-bytes)
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB
spring.servlet.multipart.file-size-threshold=1MB

# -----------------------------------------------------------------------------
# Actuator
# -----------------------------------------------------------------------------
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.health.db.enabled=true
management.health.redis.enabled=true

# -----------------------------------------------------------------------------
# Logging
# - Patterns, file appenders y routing por categoría se definen en logback-spring.xml.
# - Aquí solo dejamos los knobs por variable de entorno: LOG_PATH, LOG_LEVEL_*.
# -----------------------------------------------------------------------------
# LOG_PATH        : ruta base de archivos (default ./logs)
# LOG_LEVEL_ROOT  : nivel del logger root (default INFO)
# LOG_LEVEL_APP   : nivel del paquete com.edushift (default INFO; DEBUG en dev)
# Categorías expuestas como loggers SLF4J (ver com.edushift.shared.constants.LoggerNames):
#   - edushift.security
#   - edushift.requests
#   - edushift.exceptions
#   - edushift.ai
#   - edushift.audit
logging.config=classpath:logback-spring.xml

spring.output.ansi.enabled=ALWAYS
# =============================================================================
# Rate limit (QA plan 2026-07-02 / 10-rate-limit-spec-y-status.md)
# =============================================================================
# Defaults published in the canonical spec. Override per environment
# (e.g. stricter quotas in prod). Each rule declares:
#   - path:       Ant path matcher (per the interceptor below)
#   - scope:      IP | USER | TENANT
#   - capacity:   max requests inside the window
#   - refill-seconds: window length
#   - burst (optional): override burst capacity (default = capacity)
#
edushift.ratelimit.enabled=true
edushift.ratelimit.emit-headers=true

# Public self-signup (DEBT-TEN-6, already enforced at runtime)
edushift.ratelimit.rules[0].path=/v1/tenants/register
edushift.ratelimit.rules[0].scope=IP
edushift.ratelimit.rules[0].capacity=5
edushift.ratelimit.rules[0].refill-seconds=3600
edushift.ratelimit.rules[0].description=tenants-register

# Login — 10 per minute per IP (OWASP A07)
edushift.ratelimit.rules[1].path=/v1/auth/login
edushift.ratelimit.rules[1].scope=IP
edushift.ratelimit.rules[1].capacity=10
edushift.ratelimit.rules[1].refill-seconds=60
edushift.ratelimit.rules[1].description=auth-login

# Refresh — generous for legitimate clients but capped to avoid loops
edushift.ratelimit.rules[2].path=/v1/auth/refresh
edushift.ratelimit.rules[2].scope=IP
edushift.ratelimit.rules[2].capacity=60
edushift.ratelimit.rules[2].refill-seconds=60
edushift.ratelimit.rules[2].description=auth-refresh

# Forgot password — strict anti-enumeration (5/h/IP)
edushift.ratelimit.rules[3].path=/v1/auth/forgot-password
edushift.ratelimit.rules[3].scope=IP
edushift.ratelimit.rules[3].capacity=5
edushift.ratelimit.rules[3].refill-seconds=3600
edushift.ratelimit.rules[3].description=auth-forgot

# Reset password — same budget as forgot
edushift.ratelimit.rules[4].path=/v1/auth/reset-password
edushift.ratelimit.rules[4].scope=IP
edushift.ratelimit.rules[4].capacity=5
edushift.ratelimit.rules[4].refill-seconds=3600
edushift.ratelimit.rules[4].description=auth-reset

# Invitation token lookups — anti brute force (100/min/IP)
edushift.ratelimit.rules[5].path=/v1/users/invitations/by-token/**
edushift.ratelimit.rules[5].scope=IP
edushift.ratelimit.rules[5].capacity=100
edushift.ratelimit.rules[5].refill-seconds=60
edushift.ratelimit.rules[5].description=invitations-token-lookup

# Invitation creation — 50/h per TA (USER scope)
edushift.ratelimit.rules[6].path=/v1/users/invitations
edushift.ratelimit.rules[6].scope=USER
edushift.ratelimit.rules[6].capacity=50
edushift.ratelimit.rules[6].refill-seconds=3600
edushift.ratelimit.rules[6].description=invitations-create

# Logout — 30/min per IP (previene abuso)
edushift.ratelimit.rules[7].path=/v1/auth/logout
edushift.ratelimit.rules[7].scope=IP
edushift.ratelimit.rules[7].capacity=30
edushift.ratelimit.rules[7].refill-seconds=60
edushift.ratelimit.rules[7].description=auth-logout

# Redis deshabilitado: gestionado por RedisAutoConfigExclusion (excluye autoconfig
# y aporta NoOpCacheManager cuando edushift.redis.enabled=false). Mantener esto
# solo si quieres forzarlo por entorno; déjalo comentado por defecto.
# spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# -----------------------------------------------------------------------------
# Email transaccional (invitaciones 1:1, password reset, eventos puntuales)
# Anuncios = IN_APP only (no fan-out SMTP mientras se use Gmail).
# -----------------------------------------------------------------------------
edushift.contact.support-email=${EDUSHIFT_SUPPORT_EMAIL:soporte@edushift.pe}
edushift.contact.privacy-email=${EDUSHIFT_PRIVACY_EMAIL:privacidad@edushift.pe}
edushift.contact.legal-email=${EDUSHIFT_LEGAL_EMAIL:legales@edushift.pe}
app.notifications.email.enabled=${APP_NOTIFICATIONS_EMAIL_ENABLED:false}
app.notifications.email.from=${APP_NOTIFICATIONS_EMAIL_FROM:noreply@edushift.pe}
app.notifications.email.default-logo-url=${APP_NOTIFICATIONS_EMAIL_DEFAULT_LOGO_URL:}
app.notifications.email.unsubscribe-secret=${APP_NOTIFICATIONS_EMAIL_UNSUBSCRIBE_SECRET:}
app.notifications.email.frontend-url=${FRONTEND_URL:https://app.edushift.pe}
app.notifications.email.unsubscribe-ttl-hours=${APP_NOTIFICATIONS_EMAIL_UNSUBSCRIBE_TTL_HOURS:24}
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
