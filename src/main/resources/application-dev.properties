# =============================================================================
# EduShift - perfil desarrollo
# PostgreSQL local o contenedor; pool pequeño y SQL logging opcional
# =============================================================================

# -----------------------------------------------------------------------------
# PostgreSQL - datasource (variables de entorno con defaults locales)
# -----------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:edushift}?currentSchema=${DB_SCHEMA:edushift}&sslmode=${DB_SSL_MODE:disable}&ApplicationName=${DB_APPLICATION_NAME:edushift-back-dev}&options=-c%20TimeZone%3DUTC
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:3ianian3}

# -----------------------------------------------------------------------------
# HikariCP - optimizado para desarrollo (arranque rápido, pocos recursos)
# -----------------------------------------------------------------------------
spring.datasource.hikari.minimum-idle=${HIKARI_MINIMUM_IDLE:2}
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAXIMUM_POOL_SIZE:5}
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT:300000}
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME:600000}
spring.datasource.hikari.keepalive-time=${HIKARI_KEEPALIVE_TIME:120000}
spring.datasource.hikari.leak-detection-threshold=${HIKARI_LEAK_DETECTION:60000}
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT:10000}

# -----------------------------------------------------------------------------
# JPA - logging SQL opcional (SQL_LOGGING_ENABLED=true|false, default true)
# -----------------------------------------------------------------------------
spring.jpa.show-sql=${SQL_LOGGING_ENABLED:true}
spring.jpa.properties.hibernate.format_sql=${SQL_LOGGING_ENABLED:true}
spring.jpa.properties.hibernate.highlight_sql=${SQL_LOGGING_ENABLED:true}
spring.jpa.properties.hibernate.use_sql_comments=${SQL_LOGGING_ENABLED:true}

logging.level.org.hibernate.SQL=${SQL_LOGGING_LEVEL:DEBUG}
logging.level.org.hibernate.orm.jdbc.bind=${SQL_BIND_LOGGING_LEVEL:TRACE}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${SQL_BIND_LOGGING_LEVEL:TRACE}
logging.level.com.zaxxer.hikari=${HIKARI_LOG_LEVEL:INFO}
logging.level.com.edushift=${APP_LOG_LEVEL:DEBUG}
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}

# -----------------------------------------------------------------------------
# Flyway - desarrollo (clean deshabilitado por defecto; ver FLYWAY_CLEAN_DISABLED)
# -----------------------------------------------------------------------------
spring.flyway.clean-disabled=${FLYWAY_CLEAN_DISABLED:true}
spring.flyway.clean-on-validation-error=false
logging.level.org.flywaydb=${FLYWAY_LOG_LEVEL:DEBUG}

# -----------------------------------------------------------------------------
# Redis - desarrollo
# -----------------------------------------------------------------------------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=false
spring.data.redis.lettuce.pool.max-active=8

logging.level.io.lettuce.core=${REDIS_LOG_LEVEL:INFO}

# -----------------------------------------------------------------------------
# Aplicación / Frontend / CORS (dev)
# -----------------------------------------------------------------------------
app.base-url=${APP_BASE_URL:http://localhost:8081}
app.frontend.url=${FRONTEND_URL:http://localhost:4201}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4201,http://localhost:5173,http://localhost:3000,http://localhost:4200}
# Tunnel origins for mobile/QA testing (devtunnels, ngrok, cloudflared, localtunnel).
# Wildcard patterns are required because the host prefix is random per session.
# Only enabled in dev — application-prod.properties leaves this empty.
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:https://*.devtunnels.ms,https://*.ngrok-free.app,https://*.ngrok.io,https://*.ngrok.app,https://*.ngrok.dev,https://*.trycloudflare.com,https://*.loca.lt,https://*.lhr.life}

# -----------------------------------------------------------------------------
# Seguridad / JWT (dev)
# El secreto puede sobreescribirse con JWT_SECRET. El default es OBVIAMENTE
# inseguro (a propósito) y solo aplica en perfil dev local: nunca debe llegar
# a staging/prod (application-prod.properties NO tiene default).
# Mínimo 32 chars para HS256.
# -----------------------------------------------------------------------------
app.security.jwt.secret=${JWT_SECRET:dev-only-edushift-jwt-secret-change-me-in-prod-2026}

# -----------------------------------------------------------------------------
# Dev-only MFA enrolment bypass (Sprint 15 / F-02 follow-up)
# -----------------------------------------------------------------------------
# El endpoint POST /admin/dev/complete-mfa está @Profile-gated a {dev,local};
# en prod ni siquiera existe el bean. En dev este código estático se compara
# en tiempo constante contra el header X-Dev-Code y permite cerrar el flujo
# de onboarding MFA sin un authenticator app. Cambiar el default antes de
# exponer el perfil dev a cualquier entorno compartido.
edushift.admin.dev-bypass.code=${EDUSHIFT_DEV_MFA_BYPASS_CODE:dev-bypass}

# -----------------------------------------------------------------------------
# Integraciones (dev) - MiniMax habilitada por default
# Fallback a MockLlmClient cuando MINIMAX_API_KEY esté vacía
# (ver LlmAutoConfiguration). Para forzar mock explícitamente:
#   MINIMAX_ENABLED=false
#
# Base URL oficial (OpenAI-compatible): https://api.minimax.io/v1
# Modelo (oficial): MiniMax-M3
# Panel de keys: https://platform.minimax.io/user-center/basic-information/interface-key
# -----------------------------------------------------------------------------
app.llm.minimax.enabled=${MINIMAX_ENABLED:true}
app.llm.minimax.api-key=${MINIMAX_API_KEY:}
app.llm.minimax.base-url=${MINIMAX_BASE_URL:https://api.minimax.io/v1}
app.llm.minimax.default-model=${MINIMAX_DEFAULT_MODEL:MiniMax-M3}
app.llm.minimax.timeout=${MINIMAX_TIMEOUT:30s}
app.llm.minimax.max-retries=${MINIMAX_MAX_RETRIES:2}

app.integrations.firebase.enabled=${FIREBASE_ENABLED:false}

# -----------------------------------------------------------------------------
# Background jobs del ciclo corto — suspendidos en dev
# En local los jobs consumen CPU/conexiones y ensucian logs sin aportar
# valor (tests no los necesitan y el operador los dispara a mano).
# Para reactivarlos puntualmente: APP_REPORTS_PROCESSOR_ENABLED=true ./start.sh
# (matchIfMissing=true en las clases → prod no se ve afectado si la prop
# no está definida; los defaults quedan en true.)
# -----------------------------------------------------------------------------
# SMTP: Spring Boot mapea SPRING_MAIL_* del entorno. Sin host no se crea JavaMailSender.
# Cargar edushift-back/.env antes de spring-boot:run para enviar invitaciones.
app.notifications.email.enabled=${APP_NOTIFICATIONS_EMAIL_ENABLED:false}
app.notifications.email.from=${APP_NOTIFICATIONS_EMAIL_FROM:noreply@edushift.local}
app.notifications.email.default-logo-url=${APP_NOTIFICATIONS_EMAIL_DEFAULT_LOGO_URL:}
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.reports.processor.enabled=${APP_REPORTS_PROCESSOR_ENABLED:false}
app.reports.sweeper.enabled=${APP_REPORTS_SWEEPER_ENABLED:false}
app.ai.sweeper.enabled=${APP_AI_SWEEPER_ENABLED:false}
app.dashboard.mv-refresh.enabled=${APP_DASHBOARD_MV_REFRESH_ENABLED:false}
app.reports.scheduler.enabled=${APP_REPORTS_SCHEDULER_ENABLED:false}

# -----------------------------------------------------------------------------
# Actuator
# -----------------------------------------------------------------------------
management.endpoint.health.show-details=always
