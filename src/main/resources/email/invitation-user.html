<h1 style="margin:0 0 16px;font-size:22px;line-height:1.3;color:#0f172a;font-weight:700">{{heading}}</h1>
<p style="margin:0 0 16px;font-size:15px;line-height:1.55;color:#334155">
  {{body}}
</p>
<p style="margin:0 0 24px">
  <a href="{{acceptUrl}}" style="display:inline-block;background:{{primaryColor}};color:#ffffff;text-decoration:none;font-weight:600;padding:12px 20px;border-radius:10px">Activar mi cuenta</a>
</p>
<p style="margin:0 0 8px;font-size:13px;color:#64748b">El enlace vence el {{expiry}}.</p>
<p style="margin:0;font-size:12px;color:#94a3b8;word-break:break-all">{{acceptUrl}}</p>
