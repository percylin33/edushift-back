<h1 style="margin:0 0 16px;font-size:22px;line-height:1.3;color:#0f172a;font-weight:700">Restablece tu contraseña</h1>
<p style="margin:0 0 12px;font-size:15px;line-height:1.55;color:#334155">
  Hola <strong>{{userFirstName}}</strong>,
</p>
<p style="margin:0 0 16px;font-size:15px;line-height:1.55;color:#334155">
  Recibimos una solicitud para restablecer la contraseña de tu cuenta en
  <strong>{{schoolName}}</strong>. Si no fuiste tú, ignora este mensaje.
</p>
<p style="margin:0 0 24px">
  <a href="{{resetUrl}}" style="display:inline-block;background:{{primaryColor}};color:#ffffff;text-decoration:none;font-weight:600;padding:12px 20px;border-radius:10px">Restablecer contraseña</a>
</p>
<p style="margin:0 0 8px;font-size:13px;color:#64748b">Válido por <strong>{{ttlMinutes}} minutos</strong>.</p>
<p style="margin:0;font-size:12px;color:#94a3b8;word-break:break-all">{{resetUrl}}</p>
