# =============================================================================
# EduShift - perfil producción
# Requiere variables de entorno para credenciales y host (sin defaults inseguros)
# =============================================================================

# Excluir autoconfiguración de Redis cuando edushift.redis.enabled=false.
# Spring Boot no acepta placeholder en spring.autoconfigure.exclude, así que
# lo evaluamos vía SpEL NO es soportado. Workaround: usar @EnableAutoConfiguration
# exclude en RedisAutoConfigExclusion (ver com.edushift.infrastructure.redis).

# -----------------------------------------------------------------------------
# PostgreSQL - datasource (obligatorio vía entorno)
#
# Plataformas PaaS (Render/Railway/Heroku/fly.io) exponen la conexión como
# Plataformas PaaS (Render/Railway/Heroku/fly.io) exponen la conexión como
# DATABASE_URL (postgresql://user:pass@host:port/db). Spring Boot 3 lo soporta
# nativamente: si SPRING_DATASOURCE_URL está seteado, tiene prioridad sobre la
# construcción manual desde DB_HOST/PORT/NAME. Si no está, se construye la URL
# desde las variables DB_* (útil para docker-compose, docker run directo, VPS).
# -----------------------------------------------------------------------------
# sslmode default = require (Render / managed Postgres). Docker Compose sets
# DB_SSL_MODE=disable explicitly for the in-network Postgres without TLS.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?currentSchema=${DB_SCHEMA:edushift}&sslmode=${DB_SSL_MODE:require}&ApplicationName=${DB_APPLICATION_NAME:edushift-back}&options=-c%20TimeZone%3DUTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}

# -----------------------------------------------------------------------------
# HikariCP - pool para producción
# Defaults bajos para PaaS chico (Render 512Mi). Subí HIKARI_* en VPS/prod grande.
# -----------------------------------------------------------------------------
spring.datasource.hikari.minimum-idle=${HIKARI_MINIMUM_IDLE:2}
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAXIMUM_POOL_SIZE:8}
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME:1800000}
spring.datasource.hikari.keepalive-time=${HIKARI_KEEPALIVE_TIME:300000}
spring.datasource.hikari.leak-detection-threshold=0
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT:30000}

# -----------------------------------------------------------------------------
# JPA - sin logging SQL en producción
# -----------------------------------------------------------------------------
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.highlight_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false
spring.jpa.properties.hibernate.generate_statistics=false

logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.org.flywaydb=INFO
logging.level.com.edushift=${APP_LOG_LEVEL:INFO}
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:WARN}

# -----------------------------------------------------------------------------
# Flyway - producción (sin clean; validación estricta)
# -----------------------------------------------------------------------------
spring.flyway.clean-disabled=true
spring.flyway.clean-on-validation-error=false
spring.flyway.validate-on-migrate=true
spring.flyway.ignore-migration-patterns=*:future
logging.level.org.flywaydb=${FLYWAY_LOG_LEVEL:WARN}

# -----------------------------------------------------------------------------
# Redis - producción
#
# Render / Railway / Heroku:
#   - REDIS_URL=redis://…  or  rediss://…   (from the Redis addon)
#   - NEVER put DATABASE_URL here — that is Postgres and breaks startup with:
#       "The scheme 'postgresql' is not supported"
#   - If you have no Redis yet: EDUSHIFT_REDIS_ENABLED=false
#
# SPRING_DATA_REDIS_URL wins when set; otherwise REDIS_URL is mapped by
# PaaSEnvironmentPostProcessor. Do not force an empty url= property — an empty
# string makes Spring Data Redis try to parse scheme "null".
# -----------------------------------------------------------------------------
spring.data.redis.host=${REDIS_HOST:}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
# Default false: Docker Redis has no TLS. Set REDIS_SSL_ENABLED=true on PaaS (rediss://).
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}
# Redis pool — keep small on 512Mi instances
spring.data.redis.lettuce.pool.max-active=${REDIS_POOL_MAX_ACTIVE:8}
spring.data.redis.lettuce.pool.max-idle=${REDIS_POOL_MAX_IDLE:4}
spring.data.redis.lettuce.pool.min-idle=${REDIS_POOL_MIN_IDLE:0}

# Disable Redis entirely when the addon is not provisioned (Render free tier, etc.).
edushift.redis.enabled=${EDUSHIFT_REDIS_ENABLED:true}

edushift.redis.cache.dashboards.ttl=${CACHE_TTL_DASHBOARDS:3m}
edushift.redis.cache.permissions.ttl=${CACHE_TTL_PERMISSIONS:10m}
edushift.redis.cache.tenant-config.ttl=${CACHE_TTL_TENANT_CONFIG:30m}
edushift.redis.cache.ai-context.ttl=${CACHE_TTL_AI_CONTEXT:15m}

# -----------------------------------------------------------------------------
# Aplicación / Frontend / CORS (prod)
# Render inyecta RENDER_EXTERNAL_URL (https://tu-servicio.onrender.com).
# Preferí setear FRONTEND_URL / APP_BASE_URL / CORS_ALLOWED_ORIGINS explícitos.
# -----------------------------------------------------------------------------
app.base-url=${APP_BASE_URL:${RENDER_EXTERNAL_URL}}
app.frontend.url=${FRONTEND_URL:${APP_BASE_URL:${RENDER_EXTERNAL_URL}}}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${FRONTEND_URL:${APP_BASE_URL:${RENDER_EXTERNAL_URL}}}}

# -----------------------------------------------------------------------------
# Seguridad / JWT (prod) - secreto obligatorio
# -----------------------------------------------------------------------------
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.issuer=${JWT_ISSUER:edushift}
app.security.jwt.audience=${JWT_AUDIENCE:edushift-clients}

# -----------------------------------------------------------------------------
# Integraciones (prod) - sin defaults para credenciales
# En prod la api-key DEBE venir del secret manager (Vault/k8s Secret/Heroku
# Config Vars). NO commitear nunca.
#
# Override por env vars:
#   export MINIMAX_API_KEY=$(vault read -field=value secret/edushift/minimax)
#   export MINIMAX_BASE_URL=https://api.minimax.io/v1
#   export MINIMAX_DEFAULT_MODEL=MiniMax-M3
#
# Base URL oficial (OpenAI-compatible): https://api.minimax.io/v1
# Panel de keys: https://platform.minimax.io/user-center/basic-information/interface-key
# -----------------------------------------------------------------------------
app.llm.minimax.enabled=${MINIMAX_ENABLED:true}
app.llm.minimax.api-key=${MINIMAX_API_KEY}
app.llm.minimax.base-url=${MINIMAX_BASE_URL:https://api.minimax.io/v1}
app.llm.minimax.default-model=${MINIMAX_DEFAULT_MODEL:MiniMax-M3}
app.llm.minimax.timeout=${MINIMAX_TIMEOUT:30s}
app.llm.minimax.max-retries=${MINIMAX_MAX_RETRIES:2}

app.integrations.firebase.enabled=${FIREBASE_ENABLED:true}
app.integrations.firebase.project-id=${FIREBASE_PROJECT_ID}

# -----------------------------------------------------------------------------
# Actuator - superficie mínima
# -----------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
