name: backend-ci

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Maven verify and PostgreSQL integration tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: edushift_ci
          POSTGRES_USER: edushift
          POSTGRES_PASSWORD: edushift
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edushift -d edushift_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan repository history for leaked secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Generate disposable test JWT key
        run: echo "JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')" >> "$GITHUB_ENV"

      - name: Run tests and coverage gates
        run: ./mvnw -B -ntp verify -Djacoco.check.skip=false
        env:
          MINIMAX_ENABLED: "false"
          STORAGE_PROVIDER: LOCAL_FS
          AUDIT_RETENTION_ENABLED: "false"
          INVOICE_CRON_ENABLED: "false"

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 7

  image-check:
    name: Build backend image without publishing (PR and version tags)
    needs: verify
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image locally without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          tags: edushift-back:scan-${{ github.sha }}
          cache-from: type=gha

      - name: Scan release image for HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: edushift-back:scan-${{ github.sha }}
          format: table
          exit-code: '1'
          vuln-type: os,library
          severity: HIGH,CRITICAL

  publish-images:
    name: Publish release images to GHCR
    needs: [verify, image-check]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract backend image metadata
        id: backend-meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/edushift-back
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=sha,format=long,prefix=sha-

      - name: Build and publish backend image
        id: backend-image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          cache-from: type=gha
          provenance: true
          sbom: true

      - name: Extract PostgreSQL image metadata
        id: postgres-meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/edushift-postgres
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=sha,format=long,prefix=sha-

      - name: Build and publish PostgreSQL image
        id: postgres-image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/postgres/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.postgres-meta.outputs.tags }}
          labels: ${{ steps.postgres-meta.outputs.labels }}
          cache-from: type=gha
          provenance: true
          sbom: true

      - name: Record published image digests
        env:
          BACKEND_DIGEST: ${{ steps.backend-image.outputs.digest }}
          POSTGRES_DIGEST: ${{ steps.postgres-image.outputs.digest }}
        run: |
          {
            echo '### GHCR release images'
            echo "- Backend: ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/edushift-back@${BACKEND_DIGEST}"
            echo "- PostgreSQL: ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/edushift-postgres@${POSTGRES_DIGEST}"
          } >> "$GITHUB_STEP_SUMMARY"
